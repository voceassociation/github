name: Notify IndexNow

# Ownership key verified live at https://voce.life/609ed2cfb745919a5e1948a1bdce3b66.txt

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  indexnow:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Submit changed pages to IndexNow
        env:
          INDEXNOW_KEY: 609ed2cfb745919a5e1948a1bdce3b66
          SITE_HOST: voce.life
          SITE_ORIGIN: https://voce.life
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python3 <<'PY'
          import json
          import os
          import subprocess
          import urllib.request
          import urllib.error
          import xml.etree.ElementTree as ET

          origin = os.environ["SITE_ORIGIN"].rstrip("/")
          host = os.environ["SITE_HOST"]
          key = os.environ["INDEXNOW_KEY"]
          event_name = os.environ["EVENT_NAME"]

          event_before = "${{ github.event.before }}"
          current = "${{ github.sha }}"

          if event_before and event_before != "0000000000000000000000000000000000000000":
              cmd = ["git", "diff", "--name-only", event_before, current]
          else:
              cmd = ["git", "show", "--pretty=", "--name-only", current]

          changed = subprocess.check_output(cmd, text=True).splitlines()

          urls = []

          # One-time bootstrap when this workflow is introduced/changed, and
          # a deliberate full resubmission when manually dispatched.
          if event_name == "workflow_dispatch" or ".github/workflows/indexnow.yml" in changed:
              tree = ET.parse("sitemap.xml")
              ns = {"sm": "http://www.sitemaps.org/schemas/sitemap/0.9"}
              urls.extend(
                  loc.text.strip()
                  for loc in tree.findall(".//sm:loc", ns)
                  if loc.text and loc.text.strip().startswith(origin)
              )
          else:
              for page_path in changed:
                  if not page_path.endswith(".html"):
                      continue
                  if page_path == "404.html":
                      continue
                  if page_path == "index.html":
                      url = origin + "/"
                  elif page_path.endswith("/index.html"):
                      url = origin + "/" + page_path[:-10].strip("/") + "/"
                  else:
                      url = origin + "/" + page_path[:-5]
                  urls.append(url)

          urls = sorted(set(urls))
          if not urls:
              print("No indexable URL changed; nothing to submit.")
              raise SystemExit(0)

          payload = {
              "host": host,
              "key": key,
              "urlList": urls,
          }

          data = json.dumps(payload).encode("utf-8")
          req = urllib.request.Request(
              "https://www.bing.com/indexnow",
              data=data,
              headers={"Content-Type": "application/json; charset=utf-8"},
              method="POST",
          )

          try:
              with urllib.request.urlopen(req, timeout=30) as response:
                  print(f"IndexNow status: {response.status}")
                  print("Submitted URLs:")
                  for url in urls:
                      print(url)
          except urllib.error.HTTPError as exc:
              print(f"IndexNow HTTP error: {exc.code}")
              print(exc.read().decode("utf-8", errors="replace"))
              raise
          PY
