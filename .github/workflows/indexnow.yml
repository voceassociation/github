name: Notify IndexNow

# Ownership key verified live at https://voce.life/9e4c71d85a2f4b6cb3098f21d7a56e40.txt

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  indexnow:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Submit changed pages to IndexNow
        env:
          INDEXNOW_KEY: 9e4c71d85a2f4b6cb3098f21d7a56e40
          SITE_HOST: voce.life
          SITE_ORIGIN: https://voce.life
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python3 <<'PY'
          import json
          import os
          import subprocess
          import urllib.request
          import urllib.error
          import time
          import xml.etree.ElementTree as ET

          origin = os.environ["SITE_ORIGIN"].rstrip("/")
          host = os.environ["SITE_HOST"]
          key = os.environ["INDEXNOW_KEY"]
          event_name = os.environ["EVENT_NAME"]

          event_before = "${{ github.event.before }}"
          current = "${{ github.sha }}"

          if event_before and event_before != "0000000000000000000000000000000000000000":
              cmd = ["git", "diff", "--name-only", event_before, current]
          else:
              cmd = ["git", "show", "--pretty=", "--name-only", current]

          changed = subprocess.check_output(cmd, text=True).splitlines()

          urls = []

          # Manual dispatch is the only deliberate full resubmission.
          # A workflow-only change probes the Atlas root instead of blasting
          # historical URLs that did not change.
          if event_name == "workflow_dispatch" or "backfill/indexnow-resubmit.json" in changed:
              tree = ET.parse("sitemap.xml")
              ns = {"sm": "http://www.sitemaps.org/schemas/sitemap/0.9"}
              urls.extend(
                  loc.text.strip()
                  for loc in tree.findall(".//sm:loc", ns)
                  if loc.text and loc.text.strip().startswith(origin)
              )
          else:
              if ".github/workflows/indexnow.yml" in changed:
                  urls.append(origin + "/atlas")

              for page_path in changed:
                  if not page_path.endswith(".html"):
                      continue
                  if page_path == "404.html":
                      continue
                  if page_path == "index.html":
                      url = origin + "/"
                  elif page_path.endswith("/index.html"):
                      url = origin + "/" + page_path[:-10].strip("/") + "/"
                  else:
                      url = origin + "/" + page_path[:-5]
                  urls.append(url)

              # Atlas permanent concept/relation pages are rendered by the
              # Worker rather than stored as individual HTML files. Whenever
              # Atlas data, routing or interface semantics change, submit the
              # complete Atlas URL family from the sitemap so Bing/Copilot and
              # other IndexNow participants see the dynamic records promptly.
              atlas_triggers = {
                  "atlas.html",
                  "fr/atlas.html",
                  "it/atlas.html",
                  "atlas.js",
                  "data/atlas.json",
                  "worker.js",
                  "sitemap.xml",
              }
              if atlas_triggers.intersection(changed):
                  tree = ET.parse("sitemap.xml")
                  ns = {"sm": "http://www.sitemaps.org/schemas/sitemap/0.9"}
                  for loc in tree.findall(".//sm:loc", ns):
                      if not loc.text:
                          continue
                      value = loc.text.strip()
                      path = value.removeprefix(origin)
                      if (
                          path == "/atlas"
                          or path.startswith("/atlas/")
                          or path == "/fr/atlas"
                          or path.startswith("/fr/atlas/")
                          or path == "/it/atlas"
                          or path.startswith("/it/atlas/")
                      ):
                          urls.append(value)

          urls = sorted(set(urls))
          if not urls:
              print("No indexable URL changed; nothing to submit.")
              raise SystemExit(0)

          payload = {
              "host": host,
              "key": key,
              "urlList": urls,
          }

          data = json.dumps(payload).encode("utf-8")
          endpoints = [
              "https://www.bing.com/indexnow",
              "https://api.indexnow.org/indexnow",
          ]

          last_error = None
          submitted = False
          verification_pending = False

          # A freshly rotated root key can briefly return
          # SiteVerificationNotCompleted while IndexNow crawls the key file.
          # Retry that specific transient state instead of turning a valid
          # deployment into a failed workflow. Other 4xx errors remain fatal.
          for attempt in range(1, 6):
              verification_pending = False

              for endpoint in endpoints:
                  req = urllib.request.Request(
                      endpoint,
                      data=data,
                      headers={
                          "Content-Type": "application/json; charset=utf-8",
                          "User-Agent": "VOCE-IndexNow/1.0",
                      },
                      method="POST",
                  )
                  try:
                      with urllib.request.urlopen(req, timeout=30) as response:
                          print(f"IndexNow endpoint: {endpoint}")
                          print(f"IndexNow status: {response.status}")
                          print(f"Submitted {len(urls)} URLs.")
                          for url in urls:
                              print(url)
                          last_error = None
                          submitted = True
                          break
                  except urllib.error.HTTPError as exc:
                      body = exc.read().decode("utf-8", errors="replace")
                      print(f"IndexNow endpoint failed: {endpoint}")
                      print(f"IndexNow HTTP error: {exc.code}")
                      print(body)

                      if exc.code == 403 and "SiteVerificationNotCompleted" in body:
                          verification_pending = True
                          last_error = exc
                          continue

                      last_error = exc
                      continue

              if submitted:
                  break

              if verification_pending and attempt < 5:
                  wait_seconds = 30 * attempt
                  print(f"IndexNow key verification is still pending; retrying in {wait_seconds}s (attempt {attempt}/5).")
                  time.sleep(wait_seconds)
                  continue

              break

          if not submitted and verification_pending:
              print("IndexNow key is live but verification is still pending at the search engine.")
              print("Leaving the workflow successful; the next content push will retry automatically.")
              raise SystemExit(0)

          if last_error is not None and not submitted:
              raise last_error
          PY
