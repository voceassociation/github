name: Ingest verified VOCE publications

on:
  push:
    branches: [main]
    paths:
      - "backfill/raw/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: voce-current-publication-ingest
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Reconcile verified source packets
        run: python3 backfill/reconcile.py

      - name: Publish permanent corpus routes
        run: python3 backfill/publish_current.py

      - name: Refresh VOCE Applied Solutions evidence
        run: python3 backfill/update_applied_solutions.py

      - name: Validate corpus consistency
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path(".")
          corpus=json.loads((root/"data/corpus.json").read_text())
          routes=json.loads((root/"data/article-routes.json").read_text())
          assert corpus["item_count"] == len(corpus["items"])
          canonical_routes=[x for x in routes["items"] if not x.get("redirect_to")]
          assert len(canonical_routes) == corpus["item_count"]
          assert sum(1 for _ in (root/"data/corpus.ndjson").open()) == corpus["item_count"]
          raw_days=sorted(p.stem for p in (root/"backfill/raw").glob("*.json") if len(p.stem)==10)
          for day in raw_days[-4:]:
              history=root/"data/history"/f"{day}.json"
              if history.exists(): assert (root/"archive"/f"{day}.html").exists()
          ids={x["id"] for x in corpus["items"]}
          assert len(ids) == corpus["item_count"]
          print({"corpus_items": corpus["item_count"], "canonical_routes": len(canonical_routes), "redirects": len(routes["items"])-len(canonical_routes)})
          PY

      - name: Commit generated corpus state
        run: |
          if git diff --quiet; then
            echo "No corpus changes."
            exit 0
          fi
          git config user.name "VOCE Corpus Automation"
          git config user.email "actions@users.noreply.github.com"
          git add archive.html archive data backfill/checkpoint.json backfill/conflicts.json backfill/publications.json feed.xml llms.txt sitemap.xml
          git commit -m "Publish verified current VOCE LinkedIn texts"
          git push

      - name: Submit published article URLs to IndexNow
        env:
          INDEXNOW_KEY: c86f946ba27001564086ad51d808e308
        run: |
          python3 - <<'PY'
          import json
          import pathlib
          import urllib.request
          import urllib.error

          root = pathlib.Path(".")
          routes = json.loads((root / "data/article-routes.json").read_text())
          raw_days = sorted(
              p.stem for p in (root / "backfill/raw").glob("*.json")
              if len(p.stem) == 10
          )
          days = set(raw_days[-4:])
          urls = sorted({
              "https://voce.life" + route["path"]
              for route in routes["items"]
              if route.get("date") in days and not route.get("redirect_to")
          })
          urls.extend(
              f"https://voce.life/archive/{day}"
              for day in sorted(days)
              if (root / "data/history" / f"{day}.json").exists()
          )
          if not urls:
              print("No current article URLs to submit.")
              raise SystemExit(0)
          key = "c86f946ba27001564086ad51d808e308"
          payload = {
              "host": "voce.life",
              "key": key,
              "keyLocation": f"https://voce.life/{key}.txt",
              "urlList": sorted(set(urls)),
          }
          request = urllib.request.Request(
              "https://api.indexnow.org/indexnow",
              data=json.dumps(payload).encode("utf-8"),
              headers={"Content-Type": "application/json; charset=utf-8"},
              method="POST",
          )
          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  print(f"IndexNow status: {response.status}")
                  print(f"Submitted URL count: {len(payload['urlList'])}")
          except urllib.error.HTTPError as exc:
              print(f"IndexNow HTTP error: {exc.code}")
              print(exc.read().decode("utf-8", errors="replace"))
              raise
          PY
