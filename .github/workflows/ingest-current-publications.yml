name: Ingest verified VOCE publications

on:
  push:
    branches: [main]
    paths:
      - "backfill/raw/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: voce-current-publication-ingest
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Reconcile verified source packets
        run: python3 backfill/reconcile.py

      - name: Publish permanent corpus routes
        run: python3 backfill/publish_current.py

      - name: Validate corpus consistency
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path(".")
          corpus=json.loads((root/"data/corpus.json").read_text())
          routes=json.loads((root/"data/article-routes.json").read_text())
          assert corpus["item_count"] == len(corpus["items"])
          canonical_routes=[x for x in routes["items"] if not x.get("redirect_to")]
          assert len(canonical_routes) == corpus["item_count"]
          assert sum(1 for _ in (root/"data/corpus.ndjson").open()) == corpus["item_count"]
          raw_days=sorted(p.stem for p in (root/"backfill/raw").glob("*.json") if len(p.stem)==10)
          for day in raw_days[-4:]:
              history=root/"data/history"/f"{day}.json"
              if history.exists(): assert (root/"archive"/f"{day}.html").exists()
          ids={x["id"] for x in corpus["items"]}
          assert len(ids) == corpus["item_count"]
          print({"corpus_items": corpus["item_count"], "canonical_routes": len(canonical_routes), "redirects": len(routes["items"])-len(canonical_routes)})
          PY

      - name: Commit generated corpus state
        run: |
          if git diff --quiet; then
            echo "No corpus changes."
            exit 0
          fi
          git config user.name "VOCE Corpus Automation"
          git config user.email "actions@users.noreply.github.com"
          git add archive.html archive data backfill/checkpoint.json backfill/conflicts.json backfill/publications.json feed.xml llms.txt sitemap.xml
          git commit -m "Publish verified current VOCE LinkedIn texts"
          git push
