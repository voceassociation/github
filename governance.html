<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#fbfaf6">
<title>VOCE</title>
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<header>
  <div class="wrap nav">
    <a class="voce-mark" href="/" aria-label="VOCE"></a>
    <nav class="menu">
      <a href="/#themes" data-nav-themes>Themes</a>
      <a href="/#publications" data-nav-publications>Publications</a>
      <a href="/#committee" data-nav-committee>Committee</a>
      <a class="keep" href="/#about" data-nav-about>About</a>
      <span class="lang"><button data-lang="en">EN</button><button data-lang="fr">FR</button><button data-lang="it">IT</button></span>
    </nav>
  </div>
</header>
<main>
<section class="topic-hero">
  <div class="wrap">
    <div class="topic-kicker" id="topic-kicker"></div>
    <h1 class="topic-title" id="topic-title"></h1>
    <p class="topic-deck" id="topic-deck"></p>
    <div class="topic-meta" id="topic-meta"></div>
  </div>
</section>
<section class="topic-body">
  <div class="wrap topic-layout">
    <aside class="topic-nav">
      <div class="topic-nav-label" id="topic-nav-label"></div>
      <div id="topic-nav-links"></div>
    </aside>
    <div id="chapters"></div>
  </div>
</section>
<section class="controcanto">
  <div class="wrap controcanto-grid">
    <div class="eyebrow">VOCE · Controcanto</div>
    <div class="controcanto-copy">
      <h2 id="philo-title"></h2>
      <p id="philo"></p>
      <a class="back" id="back" href="/#themes"></a>
    </div>
  </div>
</section>
</main>
<footer>
  <div class="wrap footer">
    <a class="voce-mark" href="/" aria-label="VOCE"></a>
    <div class="footer-right">
      <div>Paris · London · Dubai · Hangzhou · Shanghai · Hong Kong</div>
      <div><a href="https://fr.linkedin.com/in/voce-association-0030763b6" target="_blank" rel="noopener">LinkedIn</a> · contact@voce.life · © 2026 VOCE Association</div>
    </div>
  </div>
</footer>
<div class="preview">VOCE V2 Preview</div>
<script>window.VOCE_TOPIC="governance";</script>
<script src="/topics.js"></script>
</body>
</html>
